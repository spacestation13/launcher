name: "Steam Deploy"

on:
  push:
    tags:
      - "v*"
    branches:
      - dev

env:
  STEAMWORKS_SDK_COMMIT: "494c2d680b9e47bbc369496b57568f44ef2f6796"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build-steam:
    name: build-steam / ${{ matrix.variant }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        variant: [cm, ss13, ss13-playtest]
        platform: [windows-latest, ubuntu-24.04]
        include:
          - variant: cm
            features: "cm_ss13,steam"
            tauri-configs: "--config src-tauri/tauri.cm.conf.json --config src-tauri/tauri.steam.conf.json"
            sidecar-app-name: "CM-SS13 Launcher"
            exe-rename: "CM_Launcher.exe"
            steam-app-id: "4313790"
            steam-app-name: "production"
          - variant: ss13
            features: "steam,hwid"
            tauri-configs: "--config src-tauri/tauri.ss13.steam.conf.json"
            sidecar-app-name: "SS13 Launcher"
            exe-rename: "SS13_Launcher.exe"
            steam-app-id: "5287320"
            steam-app-name: "production"
          - variant: ss13-playtest
            features: "steam,hwid"
            tauri-configs: "--config src-tauri/tauri.ss13.steam.conf.json"
            sidecar-app-name: "SS13 Launcher"
            exe-rename: "SS13_Launcher.exe"
            steam-app-id: "5287330"
            steam-app-name: "playtest"
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/tauri-setup
        with:
          cache-key: steam-${{ matrix.variant }}-${{ runner.os }}
          sidecar-app-name: ${{ matrix.sidecar-app-name }}
          ssh-deploy-key: ${{ secrets.SS13HWID_DEPLOY_KEY }}
          hwid-signing-key: ${{ secrets.SS13HWID_SIGNING_KEY }}

      - name: Cache Steamworks SDK
        id: cache-steamworks
        uses: actions/cache@v6
        with:
          path: steamworks_sdk
          key: steamworks-sdk-${{ env.STEAMWORKS_SDK_COMMIT }}

      - name: Download Steamworks SDK (Windows)
        if: runner.os == 'Windows' && steps.cache-steamworks.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $commit = "$env:STEAMWORKS_SDK_COMMIT"
          Invoke-WebRequest -Uri "https://github.com/rlabrecque/SteamworksSDK/archive/$commit.zip" -OutFile "steamworks_sdk.zip"
          Expand-Archive -Path "steamworks_sdk.zip" -DestinationPath "."
          Move-Item "SteamworksSDK-$commit" "steamworks_sdk"

      - name: Download Steamworks SDK (Linux)
        if: runner.os == 'Linux' && steps.cache-steamworks.outputs.cache-hit != 'true'
        run: |
          curl -L "https://github.com/rlabrecque/SteamworksSDK/archive/$STEAMWORKS_SDK_COMMIT.zip" -o steamworks_sdk.zip
          unzip steamworks_sdk.zip
          mv "SteamworksSDK-$STEAMWORKS_SDK_COMMIT" steamworks_sdk

      - name: Install Steam SDK library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/resources"
          Copy-Item "steamworks_sdk/redistributable_bin/win64/steam_api64.dll" -Destination "src-tauri/resources/"

      - name: Install Steam SDK library (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p src-tauri/resources
          cp steamworks_sdk/redistributable_bin/linux64/libsteam_api.so src-tauri/resources/
          sudo cp steamworks_sdk/redistributable_bin/linux64/libsteam_api.so /usr/lib/
          sudo ldconfig

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LD_LIBRARY_PATH: ${{ runner.os == 'Linux' && format('/usr/lib:{0}/src-tauri/resources', github.workspace) || '' }}
          STEAM_APP_ID: ${{ matrix.steam-app-id }}
          STEAM_APP_NAME: ${{ matrix.steam-app-name }}
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: "true"
          ADD_DIR: "/tmp/lib/${{ matrix.sidecar-app-name }}"
          SS13HWID_SIGNING_KEY_PATH: ${{ env.SS13HWID_SIGNING_KEY_PATH }}
        with:
          args: --features ${{ matrix.features }} ${{ matrix.tauri-configs }} ${{ matrix.platform == 'ubuntu-24.04' && '--config src-tauri/tauri.linux.conf.json' || '' }}
          tauriScript: ${{ matrix.platform == 'ubuntu-24.04' && 'cargo tauri' || 'npx tauri' }}

      - name: Prepare Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path steam-build/windows
          Copy-Item "src-tauri/target/release/SS13_Launcher.exe" -Destination "steam-build/windows/${{ matrix.exe-rename }}"
          Copy-Item "src-tauri/resources/steam_api64.dll" -Destination "steam-build/windows/"
          Copy-Item "src-tauri/webview2-runtime" -Destination "steam-build/windows/webview2-runtime" -Recurse

      - name: Scan with Windows Defender
        if: runner.os == 'Windows'
        uses: ./.github/actions/defender-scan
        with:
          exe_path: steam-build/windows/${{ matrix.exe-rename }}
          build_name: steam-${{ matrix.variant }}-${{ github.ref_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: build-steam-${{ matrix.variant }}-windows
          path: steam-build/windows/
          retention-days: 1

      - name: Extract AppImage and prepare artifacts
        if: runner.os == 'Linux'
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract

          mkdir -p steam-build/linux
          cp -r AppDir/* steam-build/linux/
          rm -rf steam-build/linux/share/terminfo
          rm -rf steam-build/linux/share/ri

          cp src-tauri/resources/libsteam_api.so steam-build/linux/shared/lib/
          cp -r src-tauri/webview2-runtime steam-build/linux/webview2-runtime

          # Patch WebKit helper binaries to use bundled ld-linux and libraries
          _tmp_lib=$(grep '_tmp_lib=' steam-build/linux/bin/01-path-mapping-hardcoded.hook | cut -d'=' -f2 | tr -d '"')
          for f in steam-build/linux/lib/webkit2gtk-4.1/*; do
            [ -f "$f" ] && file "$f" | grep -q ELF || continue
            patchelf --force-rpath --set-rpath '$ORIGIN/..' --set-interpreter "/tmp/${_tmp_lib}/ld-linux-x86-64.so.2" "$f"
          done

          cp scripts/steam-launch.sh steam-build/linux/launch.sh
          chmod +x steam-build/linux/launch.sh

      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: build-steam-${{ matrix.variant }}-linux
          path: steam-build/linux/
          retention-days: 1

  deploy-steam:
    needs: build-steam
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cm
            steam-app-id: "4313790"
            secret-prefix: CM
          - variant: ss13
            steam-app-id: "5287320"
            secret-prefix: SS13
          - variant: ss13-playtest
            steam-app-id: "5287330"
            secret-prefix: SS13
    steps:
      - uses: actions/checkout@v7

      - name: Sync version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" src-tauri/Cargo.toml

      - name: Deploy to Steam
        uses: ./.github/actions/steam-deploy
        with:
          variant: ${{ matrix.variant }}
          steam_app_id: ${{ matrix.steam-app-id }}
          steam_username: ${{ secrets[format('{0}_STEAM_USERNAME', matrix.secret-prefix)] }}
          steam_password: ${{ secrets[format('{0}_STEAM_PASSWORD', matrix.secret-prefix)] }}
          steam_shared_secret: ${{ secrets[format('{0}_STEAM_SHARED_SECRET', matrix.secret-prefix)] }}
          steam_branch: ${{ github.ref == 'refs/heads/dev' && 'development' || 'latest' }}
