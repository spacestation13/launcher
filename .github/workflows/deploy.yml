name: "GitHub Deploy"

on:
  push:
    tags:
      - "v*"
    branches:
      - dev

permissions:
  contents: write
  issues: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes || true

  build-cm:
    name: CM-SS13 Launcher
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      variant: cm
      features: "cm_ss13,hwid"
      tauri-configs: "--config src-tauri/tauri.cm.conf.json"
      tarball-prefix: "cm-ss13-launcher"
    secrets: inherit

  build-ss13:
    name: SS13 Launcher
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      variant: ss13
      features: "hwid"
      tarball-prefix: "ss13-launcher"
      enable-updater-signing: true
      updater-json-prefer-nsis: true
      hwid-variant: "github"
    secrets: inherit
