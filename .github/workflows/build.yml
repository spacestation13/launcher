name: "Build Tauri App"

on:
  workflow_call:
    inputs:
      variant:
        description: "Build variant name (cm, ss13)"
        required: true
        type: string
      features:
        description: "Cargo features to enable"
        required: true
        type: string
      tauri-configs:
        description: "Extra --config flags (space-separated)"
        required: false
        type: string
        default: ""
      tarball-prefix:
        description: "Linux tarball archive name prefix"
        required: true
        type: string
      enable-updater-signing:
        description: "Enable Tauri updater signing keys"
        required: false
        type: boolean
        default: false
      updater-json-prefer-nsis:
        description: "Pass updaterJsonPreferNsis to tauri-action"
        required: false
        type: boolean
        default: false
      hwid-variant:
        description: "HWID variant name for key registration (e.g. github, steam). If empty, key is not registered."
        required: false
        type: string
        default: ""

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  TAURI_CLI_VERBOSITY: "1"

jobs:
  generate-hwid-key:
    name: Generate HWID keypair
    runs-on: ubuntu-latest
    outputs:
      signing-key: ${{ steps.keygen.outputs.signing-key }}
      public-key: ${{ steps.keygen.outputs.public-key }}
    steps:
      - name: Generate ed25519 keypair
        id: keygen
        env:
          PASSPHRASE: ${{ secrets.HUB_DEPLOY_TOKEN }}
        run: |
          openssl genpkey -algorithm ed25519 -outform DER -out hwid-key-full.der
          SIGNING_KEY=$(tail -c 32 hwid-key-full.der | base64 -w0)
          PUBLIC_KEY=$(openssl pkey -in hwid-key-full.der -inform DER -pubout -outform DER | tail -c 32 | base64 -w0)
          rm hwid-key-full.der
          ENCRYPTED=$(echo -n "$SIGNING_KEY" | openssl enc -aes-256-cbc -pbkdf2 -a -pass "pass:$PASSPHRASE")
          echo "signing-key=$ENCRYPTED" >> "$GITHUB_OUTPUT"
          echo "public-key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"


  build:
    name: ${{ matrix.platform }}
    needs: generate-hwid-key
    permissions:
      contents: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-24.04"
          - platform: "windows-latest"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Write HWID signing key
        shell: bash
        env:
          PASSPHRASE: ${{ secrets.HUB_DEPLOY_TOKEN }}
        run: |
          SIGNING_KEY=$(echo "${{ needs.generate-hwid-key.outputs.signing-key }}" | openssl enc -aes-256-cbc -pbkdf2 -d -a -pass "pass:$PASSPHRASE")
          echo "::add-mask::$SIGNING_KEY"
          echo -n "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/hwid-signing-key"
          echo "SS13HWID_SIGNING_KEY_PATH=$RUNNER_TEMP/hwid-signing-key" >> "$GITHUB_ENV"

      - name: Setup
        uses: ./.github/actions/tauri-setup
        with:
          cache-key: ${{ matrix.platform }}-${{ inputs.variant }}
          ssh-deploy-key: ${{ secrets.SS13HWID_DEPLOY_KEY }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: "true"
          ADD_DIR: "/tmp/lib/SS13 Launcher"
          SS13HWID_SIGNING_KEY_PATH: ${{ env.SS13HWID_SIGNING_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.enable-updater-signing && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.enable-updater-signing && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ github.ref == 'refs/heads/dev' && 'v__VERSION__-dev' || 'v__VERSION__' }}
          releaseName: ${{ github.ref == 'refs/heads/dev' && 'v__VERSION__-dev' || 'v__VERSION__' }}
          releaseBody: "See the assets to download this version and install."
          prerelease: ${{ github.ref == 'refs/heads/dev' }}
          args: --features ${{ inputs.features }} ${{ inputs.tauri-configs }} ${{ matrix.platform == 'ubuntu-24.04' && '--config src-tauri/tauri.linux.conf.json' || '' }}
          updaterJsonPreferNsis: ${{ inputs.updater-json-prefer-nsis }}
          tauriScript: ${{ matrix.platform == 'ubuntu-24.04' && 'cargo tauri' || 'npx tauri' }}

      - name: Scan with Windows Defender
        if: matrix.platform == 'windows-latest'
        uses: ./.github/actions/defender-scan
        with:
          exe_path: src-tauri/target/release/SS13_Launcher.exe
          build_name: ${{ github.ref_name }}-${{ inputs.variant }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build portable Linux tarball
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract

          mkdir -p portable-linux
          cp -r AppDir/* portable-linux/
          rm -rf portable-linux/share/terminfo

          cp -r src-tauri/webview2-runtime portable-linux/webview2-runtime

          # Patch WebKit helper binaries to use bundled ld-linux and libraries
          _tmp_lib=$(grep '_tmp_lib=' portable-linux/bin/01-path-mapping-hardcoded.hook | cut -d'=' -f2 | tr -d '"')
          for f in portable-linux/lib/webkit2gtk-4.1/*; do
            [ -f "$f" ] && file "$f" | grep -q ELF || continue
            patchelf --force-rpath --set-rpath '$ORIGIN/..' --set-interpreter "/tmp/${_tmp_lib}/ld-linux-x86-64.so.2" "$f"
          done

          cp scripts/launch.sh portable-linux/launch.sh
          cp scripts/install.sh portable-linux/install.sh
          chmod +x portable-linux/launch.sh portable-linux/install.sh

          VERSION=$(grep -oP '^version = "\K[^"]+' src-tauri/Cargo.toml)
          ARCHIVE_NAME="${{ inputs.tarball-prefix }}_${VERSION}_linux-x86_64.tar.zst"
          tar -C portable-linux -cf - . | zstd -19 -o "$ARCHIVE_NAME"
          echo "LINUX_ARCHIVE=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Upload portable Linux tarball to release
        if: matrix.platform == 'ubuntu-24.04' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" "$LINUX_ARCHIVE" --clobber

  register-hwid-key:
    name: Register HWID key
    if: inputs.hwid-variant != ''
    needs: [generate-hwid-key, build]
    runs-on: ubuntu-latest
    steps:
      - name: Register public key with hub
        run: |
          VERSION=$(echo "$GITHUB_REF_NAME" | sed 's/^v//')
          curl -f -X POST "${{ secrets.HUB_API_URL }}/manage/hwid-keys" \
            -H "Authorization: Bearer ${{ secrets.HUB_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"public_key\": \"${{ needs.generate-hwid-key.outputs.public-key }}\",
              \"variant\": \"${{ inputs.hwid-variant }}\",
              \"build_version\": \"$VERSION\"
            }"
