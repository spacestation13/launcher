name: "Deploy to Steam"
description: "Downloads build artifacts and deploys to Steam via steamcmd"

inputs:
  variant:
    description: "Build variant (cm, ss13, ss13-playtest)"
    required: true
  steam_app_id:
    description: "Steam App ID to deploy to"
    required: true
  steam_username:
    description: "Steam username"
    required: true
  steam_password:
    description: "Steam password"
    required: true
  steam_shared_secret:
    description: "Steam shared secret for TOTP generation"
    required: true
  steam_branch:
    description: "Steam branch to deploy to"
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Generate Steam TOTP
      id: steam-totp
      uses: andriivitiv/steam-totp@v1
      with:
        shared_secret: ${{ inputs.steam_shared_secret }}

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: build-steam-${{ inputs.variant }}-*
        path: build
        merge-multiple: false

    - name: Flatten artifact directories
      shell: bash
      run: |
        cd build
        for dir in build-steam-${{ inputs.variant }}-*/; do
          suffix="${dir#build-steam-${{ inputs.variant }}-}"
          suffix="${suffix%/}"
          mv "$dir" "$suffix"
        done

    - name: Get version from Cargo.toml
      id: version
      shell: bash
      run: |
        VERSION=$(grep -m1 'version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Install steamcmd
      shell: bash
      run: |
        mkdir -p ~/steamcmd && cd ~/steamcmd
        curl -sqL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar xz

    - name: Deploy to Steam
      shell: bash
      run: |
        python3 scripts/steam-build-vdfs.py \
          --app-id "${{ inputs.steam_app_id }}" \
          --branch "${{ inputs.steam_branch }}" \
          --description "v${{ steps.version.outputs.version }}" \
          --build-dir build

        ~/steamcmd/steamcmd.sh +login "${{ inputs.steam_username }}" "${{ inputs.steam_password }}" "${{ steps.steam-totp.outputs.code }}" \
          +run_app_build "$(pwd)/build/app_build.vdf" \
          +quit
